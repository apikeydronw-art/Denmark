<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Udforsk CyberGuard Marketplace og testprodukter.">
  <title>CyberGuard Marketplace</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #38bdf8; text-align: center; }
    .intro { color: #94a3b8; text-align: center; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 28px;
    }
    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 250px;
      padding: 20px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #1e293b;
    }
    .card h2 { margin: 10px 0; color: #38bdf8; font-size: 1.1rem; }
    .category {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      background: #0369a1;
      color: #e0f2fe;
      font-size: 0.75rem;
    }
    .description { color: #94a3b8; font-size: 0.9rem; line-height: 1.5; }
    .price { margin: 18px 0 12px; color: #4ade80; font-size: 1.25rem; font-weight: 700; }
    .buy-button, .pagination button {
      padding: 10px 18px;
      border: 0;
      border-radius: 6px;
      background: #0284c7;
      color: white;
      font: inherit;
    }
    .buy-button { width: 100%; background: #0284c7; color: white; }
    .buy-button:disabled { background: #334155; color: #cbd5e1; }
    .customer-email {
      display: block;
      width: min(100%, 380px);
      margin: 20px auto;
      padding: 11px 12px;
      border: 1px solid #475569;
      border-radius: 6px;
      background: #1e293b;
      color: #f8fafc;
      font: inherit;
    }
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 30px 0;
    }
    .pagination button { cursor: pointer; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #page-info, #status { color: #94a3b8; }
    #status { min-height: 1.5em; text-align: center; }
    .message { grid-column: 1 / -1; color: #94a3b8; text-align: center; }
    .error { color: #f87171; }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .pagination { gap: 10px; }
      .pagination button { padding: 9px 12px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>CyberGuard Marketplace</h1>
    <p class="intro">Udforsk produkter. Stripe-checkout er kun tilgængelig, når serveren er konfigureret.</p>
    <label class="intro" for="customer-email">E-mail til kvittering og licens</label>
    <input class="customer-email" id="customer-email" type="email" autocomplete="email"
      maxlength="254" placeholder="din@email.dk" required>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="product-grid" class="grid" aria-label="Produkter"></section>
    <nav class="pagination" aria-label="Sidevalg">
      <button id="prev-btn" type="button" disabled>Forrige</button>
      <span id="page-info">Side 1</span>
      <button id="next-btn" type="button">Næste</button>
    </nav>
  </main>

  <script>
    const limit = 20;
    let currentOffset = 0;
    let loading = false;

    const grid = document.getElementById("product-grid");
    const status = document.getElementById("status");
    const previousButton = document.getElementById("prev-btn");
    const nextButton = document.getElementById("next-btn");
    const pageInfo = document.getElementById("page-info");
    const customerEmail = document.getElementById("customer-email");
    let hasNextPage = false;
    let retryNeeded = false;

    function showMessage(message, isError = false) {
      const paragraph = document.createElement("p");
      paragraph.className = isError ? "message error" : "message";
      paragraph.textContent = message;
      grid.replaceChildren(paragraph);
    }

    async function buyProduct(itemId, button) {
      if (!customerEmail.reportValidity()) {
        customerEmail.focus();
        return;
      }

      button.disabled = true;
      status.textContent = "Opretter sikker Stripe-checkout...";
      try {
        const response = await fetch("/api/market/checkout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            item_id: itemId,
            customer_email: customerEmail.value.trim()
          })
        });
        const data = await response.json();
        if (!response.ok || !data.checkout_url) {
          throw new Error(data.detail || "Betalingen kunne ikke oprettes.");
        }
        window.location.assign(data.checkout_url);
      } catch (error) {
        status.textContent = error.message || "Kunne ikke oprette forbindelse til betalingsserveren.";
        button.disabled = false;
      }
    }

    function createProductCard(product) {
      const card = document.createElement("article");
      card.className = "card";

      const details = document.createElement("div");
      const category = document.createElement("span");
      category.className = "category";
      category.textContent = product.category || "Generel";

      const title = document.createElement("h2");
      title.textContent = product.item_name || "Unavngivet produkt";

      const description = document.createElement("p");
      description.className = "description";
      description.textContent = product.description || "Ingen beskrivelse.";
      details.append(category, title, description);

      const purchase = document.createElement("div");
      const price = document.createElement("p");
      price.className = "price";
      price.textContent = Number.isFinite(product.price_usd)
        ? `$${product.price_usd.toFixed(2)}`
        : "Pris ikke angivet";

      const button = document.createElement("button");
      button.className = "buy-button";
      button.type = "button";
      button.disabled = !product.purchasable;
      button.textContent = product.purchasable ? "Køb nu" : "Køb ikke tilgængeligt";
      button.setAttribute("aria-label", `${button.textContent}: ${product.item_name || "produkt"}`);
      if (product.purchasable) {
        button.addEventListener("click", () => buyProduct(product.item_id, button));
      }
      purchase.append(price, button);
      card.append(details, purchase);
      return card;
    }

    async function fetchProducts(offset) {
      if (loading) return;
      loading = true;
      previousButton.disabled = true;
      nextButton.disabled = true;
      status.textContent = "Indlæser produkter...";

      try {
        const response = await fetch(`/api/market/products?limit=${limit}&offset=${offset}`);
        if (!response.ok) {
          throw new Error(`Serveren svarede med HTTP ${response.status}`);
        }
        const data = await response.json();
        if (!Array.isArray(data.products)) {
          throw new Error("Serverens produktsvar havde et ugyldigt format");
        }

        currentOffset = offset;
        hasNextPage = data.total_returned >= limit;
        retryNeeded = false;
        nextButton.textContent = "Næste";
        if (data.products.length === 0) {
          showMessage("Ingen produkter fundet.");
        } else {
          grid.replaceChildren(...data.products.map(createProductCard));
        }
        pageInfo.textContent = `Side ${Math.floor(offset / limit) + 1}`;
        previousButton.disabled = offset === 0;
        nextButton.disabled = data.total_returned < limit;
        status.textContent = "";
      } catch (error) {
        showMessage("Kunne ikke hente produkter. Prøv igen om lidt.", true);
        status.textContent = "";
        retryNeeded = true;
        nextButton.textContent = "Prøv igen";
        console.error("Could not load marketplace products:", error);
      } finally {
        loading = false;
        previousButton.disabled = currentOffset === 0;
        nextButton.disabled = !retryNeeded && !hasNextPage;
      }
    }

    previousButton.addEventListener("click", () => {
      if (currentOffset >= limit) fetchProducts(currentOffset - limit);
    });
    nextButton.addEventListener("click", () => {
      fetchProducts(retryNeeded ? currentOffset : currentOffset + limit);
    });
    fetchProducts(0);
  </script>
</body>
</html>
